<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofbuzz Widescreen 3D Flipbook Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include PageFlip library from CDN for realistic 3D page curling & turning physics -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <style>
        body {
            background-color: #FAF8F5;
            color: #1A1A1A;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }
        .bg-cream { background-color: #FAF8F5; }
        .bg-maroon { background-color: #800020; }
        .text-maroon { color: #800020; }
        .border-maroon { border-color: #800020; }

        /* Book Shadow & Container Polish */
        #book {
            box-shadow: 0 25px 60px -15px rgba(128, 0, 32, 0.3);
            border-radius: 6px;
        }

        /* Custom scrollbar for thumbnails */
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FAF8F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #800020;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-cream min-h-screen flex flex-col justify-between selection:bg-[#800020] selection:text-white">

    <!-- Top Navigation Header -->
    <header class="w-full border-b border-[#800020]/20 bg-[#FAF8F5]/90 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-maroon rounded-lg flex items-center justify-center text-white font-bold text-base shadow-md">O</div>
            <div>
                <h1 class="text-lg md:text-xl font-bold tracking-wide text-maroon">OFBUZZ FLIPBOOK</h1>
                <p class="text-xs text-neutral-600 tracking-wider uppercase font-medium">16:9 Realistic 3D Paper Edition</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleFullscreen()" class="hidden md:flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold text-maroon border border-maroon/30 hover:bg-[#800020]/10 rounded-lg transition shadow-sm" title="Toggle Fullscreen">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                <span>Fullscreen</span>
            </button>
            <span id="page-indicator" class="text-sm font-semibold px-4 py-1.5 bg-[#800020]/10 text-maroon rounded-full border border-[#800020]/20 shadow-inner">
                Loading Pages...
            </span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 md:p-6 max-w-7xl mx-auto w-full">
        
        <!-- Flipbook Viewport Container -->
        <div class="relative w-full max-w-5xl aspect-[16/9] flex items-center justify-center my-2" id="viewport-container">
            
            <!-- Loading Overlay -->
            <div id="loading-overlay" class="absolute inset-0 bg-[#FAF8F5] z-50 flex flex-col items-center justify-center transition-opacity duration-700 rounded-2xl shadow-inner">
                <div class="w-12 h-12 border-4 border-[#800020] border-t-transparent rounded-full animate-spin mb-4 shadow-md"></div>
                <p class="text-sm font-semibold text-maroon tracking-wider animate-pulse">Initializing 3D Book Physics...</p>
            </div>

            <!-- Navigation Arrow Left -->
            <button onclick="prevPage()" class="absolute left-2 md:-left-6 z-40 bg-white/90 hover:bg-white text-maroon p-3.5 rounded-full shadow-xl border border-[#800020]/30 transition transform hover:scale-110 active:scale-95 focus:outline-none" title="Previous Page">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
                </svg>
            </button>

            <!-- PageFlip Canvas Element Container -->
            <div id="book" class="w-full h-full">
                <!-- Pages will be dynamically injected here for PageFlip -->
            </div>

            <!-- Navigation Arrow Right -->
            <button onclick="nextPage()" class="absolute right-2 md:-right-6 z-40 bg-white/90 hover:bg-white text-maroon p-3.5 rounded-full shadow-xl border border-[#800020]/30 transition transform hover:scale-110 active:scale-95 focus:outline-none" title="Next Page">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>

        <!-- Controls Toolbar -->
        <div class="mt-6 flex flex-wrap items-center justify-center gap-3 w-full max-w-5xl bg-white p-4 rounded-xl border border-[#800020]/20 shadow-md">
            <button onclick="firstPage()" class="px-4 py-2 text-sm font-semibold text-maroon hover:bg-[#800020]/10 rounded-lg transition">First Page</button>
            <button onclick="prevPage()" class="px-5 py-2 text-sm font-semibold text-white bg-maroon rounded-lg hover:bg-[#630019] shadow transition">Previous</button>
            
            <div class="flex items-center gap-2 px-3">
                <input type="range" id="page-slider" min="0" max="15" value="0" oninput="jumpToPage(this.value)" class="w-40 md:w-56 accent-[#800020] cursor-pointer">
            </div>
            
            <button onclick="nextPage()" class="px-5 py-2 text-sm font-semibold text-white bg-maroon rounded-lg hover:bg-[#630019] shadow transition">Next</button>
            <button onclick="toggleAutoPlay()" id="autoplay-btn" class="px-4 py-2 text-sm font-semibold border-2 border-maroon text-maroon hover:bg-[#800020]/10 rounded-lg transition">Auto Play: Off</button>
            <button onclick="lastPage()" class="px-4 py-2 text-sm font-semibold text-maroon hover:bg-[#800020]/10 rounded-lg transition">Last Page</button>
        </div>

        <!-- Thumbnail Strip -->
        <div class="mt-5 w-full max-w-5xl overflow-x-auto pb-3 flex gap-3 scrollbar-thin">
            <div id="thumbnail-strip" class="flex gap-3 px-1 items-center"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 border-t border-[#800020]/20 text-xs text-neutral-500 bg-[#FAF8F5]">
        Ofbuzz Technology &bull; Realistic 3D Page-Curl Flipbook Viewer
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const imageUrls = [
            "https://i.ibb.co/bRGHbfYC/1-1.png",
            "https://i.ibb.co/tM5qwYJ7/2-1.png",
            "https://i.ibb.co/SXfNbWNh/3-1.png",
            "https://i.ibb.co/hRFNhYnF/4-1.png",
            "https://i.ibb.co/twtN35Hy/5-1.png",
            "https://i.ibb.co/bMwMcr6Q/6-1.png",
            "https://i.ibb.co/LDH43PBY/7-1.png",
            "https://i.ibb.co/sdwGNBtq/8-1.png",
            "https://i.ibb.co/PZp15DYs/9-1.png",
            "https://i.ibb.co/08r4zXb/10-1.png",
            "https://i.ibb.co/HL1TbQTb/11-1.png",
            "https://i.ibb.co/07SDLz6/12-1.png",
            "https://i.ibb.co/1GkhNqDt/13-1.png",
            "https://i.ibb.co/MxQH7rfb/14-1.png",
            "https://i.ibb.co/848x37DK/15-1.png",
            "https://i.ibb.co/yFh2sLD4/16-1.png"
        ];

        let flipBook = null;
        let isAutoPlaying = false;
        let autoPlayTimer = null;

        const pageIndicator = document.getElementById('page-indicator');
        const pageSlider = document.getElementById('page-slider');
        const loadingOverlay = document.getElementById('loading-overlay');
        const thumbnailStrip = document.getElementById('thumbnail-strip');
        const autoplayBtn = document.getElementById('autoplay-btn');

        // Build book pages inside DOM before initializing PageFlip
        function buildBookDom() {
            const bookElement = document.getElementById('book');
            bookElement.innerHTML = '';
            imageUrls.forEach((url, index) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page bg-white shadow-md overflow-hidden flex items-center justify-center';
                pageDiv.innerHTML = `
                    <div class="relative w-full h-full flex items-center justify-center bg-white">
                        <img src="${url}" alt="Page ${index + 1}" class="w-full h-full object-contain select-none pointer-events-none">
                        <div class="absolute bottom-2 right-4 text-[11px] font-medium text-neutral-400">${index + 1}</div>
                    </div>
                `;
                bookElement.appendChild(pageDiv);
            });
        }

        // Render Thumbnails
        function renderThumbnails() {
            thumbnailStrip.innerHTML = '';
            imageUrls.forEach((url, index) => {
                const thumb = document.createElement('div');
                thumb.className = `flex-shrink-0 w-24 aspect-video rounded-md overflow-hidden border-2 cursor-pointer transition transform hover:scale-105 shadow-sm ${index === 0 ? 'border-[#800020] ring-2 ring-[#800020]/30' : 'border-neutral-300 opacity-75 hover:opacity-100'}`;
                thumb.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                thumb.onclick = () => {
                    if (flipBook) flipBook.flip(index);
                };
                thumb.id = `thumb-${index}`;
                thumbnailStrip.appendChild(thumb);
            });
        }

        // Initialize PageFlip 3D Engine
        function initPageFlip() {
            buildBookDom();
            renderThumbnails();

            const container = document.getElementById('book');
            const containerWidth = container.clientWidth || 900;
            const singlePageWidth = containerWidth / 2;
            const containerHeight = container.clientHeight || 500;

            try {
                flipBook = new St.PageFlip(container, {
                    width: singlePageWidth,
                    height: containerHeight,
                    size: "stretch",
                    minWidth: 300,
                    maxWidth: 1200,
                    minHeight: 200,
                    maxHeight: 800,
                    maxShadowOpacity: 0.5,
                    showCover: true,
                    mobileScrollSupport: true,
                    clickEventForward: true,
                    usePortrait: false,
                    startPage: 0
                });

                flipBook.loadFromHTML(document.querySelectorAll('#book .page'));

                // Event Listeners
                flipBook.on('flip', (e) => {
                    const currentPage = e.data;
                    updateUIState(currentPage);
                });

                // Remove loading overlay once ready
                setTimeout(() => {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => loadingOverlay.remove(), 700);
                    updateUIState(0);
                }, 800);

            } catch (err) {
                console.error("PageFlip initialization error:", err);
                loadingOverlay.innerHTML = `<p class="text-maroon font-semibold">Error loading 3D book physics. Please refresh.</p>`;
            }
        }

        function updateUIState(pageIndex) {
            const leftPage = pageIndex + 1;
            const rightPage = pageIndex + 2;

            if (rightPage <= imageUrls.length) {
                pageIndicator.innerText = `Pages ${leftPage}-${rightPage} of ${imageUrls.length}`;
            } else {
                pageIndicator.innerText = `Page ${leftPage} of ${imageUrls.length}`;
            }

            pageSlider.value = pageIndex;

            // Highlight active thumbnail
            document.querySelectorAll('#thumbnail-strip > div').forEach((thumb, idx) => {
                if (idx === pageIndex || idx === pageIndex + 1) {
                    thumb.className = 'flex-shrink-0 w-24 aspect-video rounded-md overflow-hidden border-2 border-[#800020] ring-2 ring-[#800020]/30 shadow-md cursor-pointer transition transform scale-105';
                    if (idx === pageIndex) {
                        thumb.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
                    }
                } else {
                    thumb.className = 'flex-shrink-0 w-24 aspect-video rounded-md overflow-hidden border-2 border-neutral-300 opacity-75 hover:opacity-100 cursor-pointer transition';
                }
            });
        }

        function nextPage() {
            if (flipBook) {
                flipBook.flipNext();
            }
        }

        function prevPage() {
            if (flipBook) {
                flipBook.flipPrev();
            }
        }

        function firstPage() {
            if (flipBook) {
                flipBook.flip(0);
            }
        }

        function lastPage() {
            if (flipBook) {
                flipBook.flip(imageUrls.length - 1);
            }
        }

        function jumpToPage(val) {
            if (flipBook) {
                flipBook.flip(parseInt(val));
            }
        }

        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            if (isAutoPlaying) {
                autoplayBtn.innerText = "Auto Play: On";
                autoplayBtn.className = "px-4 py-2 text-sm font-semibold bg-[#800020] text-white rounded-lg shadow transition";
                autoPlayTimer = setInterval(() => {
                    if (flipBook) {
                        if (flipBook.getCurrentPageIndex() < imageUrls.length - 1) {
                            flipBook.flipNext();
                        } else {
                            flipBook.flip(0);
                        }
                    }
                }, 3500);
            } else {
                autoplayBtn.innerText = "Auto Play: Off";
                autoplayBtn.className = "px-4 py-2 text-sm font-semibold border-2 border-maroon text-maroon hover:bg-[#800020]/10 rounded-lg transition";
                clearInterval(autoPlayTimer);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error("Fullscreen error:", err.message);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Keyboard navigation support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                nextPage();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevPage();
            } else if (e.key === 'Home') {
                firstPage();
            } else if (e.key === 'End') {
                lastPage();
            }
        });

        // Initialize on window load
        window.onload = () => {
            pageSlider.max = imageUrls.length - 1;
            let loaded = 0;
            imageUrls.forEach(url => {
                const img = new Image();
                img.src = url;
                img.onload = img.onerror = () => {
                    loaded++;
                    if (loaded === imageUrls.length) {
                        initPageFlip();
                    }
                };
            });
        };
    </script>
</body>
</html>
