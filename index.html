<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal 1:1 Loop Flipbook Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        /* Realistic 3D Flip Container */
        .perspective-container {
            perspective: 2000px;
        }
        .book-wrapper {
            transform-style: preserve-3d;
        }
        .page-sheet {
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1), box-shadow 0.9s ease;
        }
        .page-sheet.flipped {
            transform: rotateY(-180deg);
        }
        /* Custom scrollbar for thumbnails */
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 100, 100, 0.3);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 100, 100, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header Navigation Bar -->
    <header class="w-full px-6 py-4 flex items-center justify-between border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-book-open text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Loop Flipbook Studio</h1>
                <p class="text-xs text-slate-400">Exact 1:1 Aspect Ratio &bull; Continuous Auto-Loop</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button id="fullscreen-btn" title="Toggle Fullscreen" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition shadow-sm border border-slate-700/50">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full">

        <!-- Flipbook Stage (Strict 1:1 Aspect Ratio Box) -->
        <div class="relative w-full flex flex-col items-center justify-center my-auto">
            
            <!-- Book Container: Exactly 1:1 Square -->
            <div class="perspective-container relative w-full max-w-[400px] sm:max-w-[460px] md:max-w-[500px] aspect-square flex items-center justify-center">
                <div id="book-element" class="book-wrapper relative w-full h-full shadow-2xl rounded-2xl bg-slate-900 border border-slate-800/80 overflow-hidden flex items-center justify-center">
                    
                    <!-- Pages Rendered Dynamically via JS -->
                    <div id="pages-wrapper" class="relative w-full h-full"></div>

                </div>
            </div>

            <!-- On-Screen Floating Navigation Buttons -->
            <button id="prev-floating" class="absolute left-2 sm:left-4 md:left-6 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-slate-900/80 hover:bg-indigo-600 text-white backdrop-blur-md shadow-xl border border-slate-700/60 flex items-center justify-center transition-all duration-200 hover:scale-110 active:scale-95 z-30 focus:outline-none">
                <i class="fa-solid fa-chevron-left text-lg"></i>
            </button>
            <button id="next-floating" class="absolute right-2 sm:right-4 md:right-6 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-slate-900/80 hover:bg-indigo-600 text-white backdrop-blur-md shadow-xl border border-slate-700/60 flex items-center justify-center transition-all duration-200 hover:scale-110 active:scale-95 z-30 focus:outline-none">
                <i class="fa-solid fa-chevron-right text-lg"></i>
            </button>
        </div>

        <!-- Controls Toolbar & Pagination Status -->
        <div class="w-full max-w-lg mt-6 flex flex-col items-center gap-4 bg-slate-900/80 backdrop-blur-md p-4 rounded-2xl border border-slate-800 shadow-2xl">
            
            <!-- Top bar of controls -->
            <div class="flex items-center justify-between w-full px-2">
                <!-- Page Indicator badge -->
                <div class="flex items-center space-x-2">
                    <span class="px-3 py-1 rounded-full bg-indigo-500/15 text-indigo-400 font-semibold text-xs tracking-wide border border-indigo-500/30" id="page-indicator">
                        Cover Page (1 of 8)
                    </span>
                </div>

                <!-- Playback & Navigation Controls -->
                <div class="flex items-center space-x-2">
                    <button id="first-btn" title="First Page / Cover" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition disabled:opacity-40 disabled:cursor-not-allowed border border-slate-700/50">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button id="prev-btn" title="Previous Page" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700/50">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <button id="play-btn" title="Auto Play Loop" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition shadow-lg shadow-indigo-600/30 flex items-center space-x-2">
                        <i id="play-icon" class="fa-solid fa-play"></i>
                        <span id="play-text">Auto Loop</span>
                    </button>
                    <button id="next-btn" title="Next Page" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700/50">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <button id="last-btn" title="Last Page" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition disabled:opacity-40 disabled:cursor-not-allowed border border-slate-700/50">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>
            </div>

            <!-- Page Scrubber / Slider Control -->
            <div class="w-full flex items-center space-x-3 px-2 pt-1 border-t border-slate-800 text-xs text-slate-400">
                <span>Scrub:</span>
                <input id="page-scrubber" type="range" min="0" max="7" step="1" value="0" class="w-full accent-indigo-500 cursor-pointer h-1.5 bg-slate-800 rounded-lg">
                <span id="scrub-label" class="font-mono text-slate-300 w-12 text-right">1/8</span>
            </div>

            <!-- Speed Slider Control -->
            <div class="w-full flex items-center space-x-3 px-2 pt-1 border-t border-slate-800 text-xs text-slate-400">
                <span>Loop Speed:</span>
                <input id="speed-range" type="range" min="1500" max="5000" step="500" value="3000" class="w-full accent-indigo-500 cursor-pointer h-1.5 bg-slate-800 rounded-lg">
                <span id="speed-label" class="font-mono text-slate-300 w-12 text-right">3.0s</span>
            </div>

        </div>

        <!-- Thumbnail Preview Strip (Square 1:1 Thumbnails) -->
        <div class="w-full max-w-4xl mt-6">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-1 flex items-center justify-between">
                <span>Square Pages & Cover Preview</span>
                <span class="text-slate-500">Click any page to jump instantly</span>
            </div>
            <div id="thumbnail-strip" class="flex items-center space-x-3 overflow-x-auto pb-2 px-1 scroll-smooth">
                <!-- Thumbnails populated by JS -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-slate-500 border-t border-slate-900">
        Normal 1:1 Flipbook &bull; Infinite Continuous Loop Enabled
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Exact cover image + 7 sequential inside pages provided
        const bookPages = [
            { type: "cover", title: "Cover Page", url: "https://i.ibb.co/V0b7JtzN/Gemini-Generated-Image-maklmpmaklmpmakl-1.png" },
            { type: "page", title: "Page 1", url: "https://i.ibb.co/nNvRrcry/1-63.png" },
            { type: "page", title: "Page 2", url: "https://i.ibb.co/nMScz3T6/4-57.png" },
            { type: "page", title: "Page 3", url: "https://i.ibb.co/9k2zpXxn/8.png" },
            { type: "page", title: "Page 4", url: "https://i.ibb.co/Gfk3XBRc/11.png" },
            { type: "page", title: "Page 5", url: "https://i.ibb.co/CKCzVhgd/12.png" },
            { type: "page", title: "Page 6", url: "https://i.ibb.co/Kjp8w7tP/15.png" },
            { type: "page", title: "Page 7", url: "https://i.ibb.co/VcMjd4sS/17.png" }
        ];

        let currentPageIndex = 0;
        let isPlaying = false;
        let playInterval = null;
        let autoPlaySpeed = 3000; // milliseconds

        // DOM Elements
        const pagesWrapper = document.getElementById('pages-wrapper');
        const pageIndicator = document.getElementById('page-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const prevFloating = document.getElementById('prev-floating');
        const nextFloating = document.getElementById('next-floating');
        const firstBtn = document.getElementById('first-btn');
        const lastBtn = document.getElementById('last-btn');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const playText = document.getElementById('play-text');
        const speedRange = document.getElementById('speed-range');
        const speedLabel = document.getElementById('speed-label');
        const pageScrubber = document.getElementById('page-scrubber');
        const scrubLabel = document.getElementById('scrub-label');
        const thumbnailStrip = document.getElementById('thumbnail-strip');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        // Initialize Flipbook Structure
        function initFlipbook() {
            pagesWrapper.innerHTML = '';
            thumbnailStrip.innerHTML = '';
            pageScrubber.max = bookPages.length - 1;

            // Render pages in reverse order so top-most page has highest z-index
            bookPages.forEach((pageData, index) => {
                const sheet = document.createElement('div');
                sheet.className = `page-sheet absolute inset-0 w-full h-full bg-slate-900 rounded-xl overflow-hidden shadow-2xl`;
                sheet.style.zIndex = bookPages.length - index;
                sheet.id = `sheet-${index}`;

                const img = document.createElement('img');
                img.src = pageData.url;
                img.alt = pageData.title;
                img.className = 'w-full h-full object-cover bg-slate-950 select-none';
                img.onerror = function() {
                    this.src = `https://placehold.co/600x600/1e293b/ffffff?text=${encodeURIComponent(pageData.title)}`;
                };

                sheet.appendChild(img);
                pagesWrapper.appendChild(sheet);

                // Thumbnail creation
                const thumb = document.createElement('div');
                thumb.className = `relative flex-shrink-0 w-16 h-16 rounded-lg overflow-hidden border-2 cursor-pointer transition-all duration-200 ${index === 0 ? 'border-indigo-500 scale-105 shadow-md shadow-indigo-500/20' : 'border-slate-800 opacity-60 hover:opacity-100 hover:border-slate-600'}`;
                thumb.id = `thumb-${index}`;
                
                const thumbImg = document.createElement('img');
                thumbImg.src = pageData.url;
                thumbImg.className = 'w-full h-full object-cover';
                thumb.appendChild(thumbImg);

                // Thumbnail click handler
                thumb.addEventListener('click', () => {
                    goToPage(index);
                    stopAutoPlay();
                });

                thumbnailStrip.appendChild(thumb);
            });

            updateBookState();
        }

        // Update UI states
        function updateBookState() {
            bookPages.forEach((_, index) => {
                const sheet = document.getElementById(`sheet-${index}`);
                const thumb = document.getElementById(`thumb-${index}`);

                if (index < currentPageIndex) {
                    sheet.classList.add('flipped');
                } else {
                    sheet.classList.remove('flipped');
                }

                if (index === currentPageIndex) {
                    thumb.className = "relative flex-shrink-0 w-16 h-16 rounded-lg overflow-hidden border-2 border-indigo-500 scale-105 shadow-md shadow-indigo-500/20 transition-all duration-200";
                } else {
                    thumb.className = "relative flex-shrink-0 w-16 h-16 rounded-lg overflow-hidden border-2 border-slate-800 opacity-60 hover:opacity-100 hover:border-slate-600 transition-all duration-200";
                }
            });

            const currentObj = bookPages[currentPageIndex];
            const titleText = currentObj.type === 'cover' ? 'Cover Page' : currentObj.title;
            pageIndicator.textContent = `${titleText} (${currentPageIndex + 1} of ${bookPages.length})`;
            pageScrubber.value = currentPageIndex;
            scrubLabel.textContent = `${currentPageIndex + 1}/${bookPages.length}`;

            firstBtn.disabled = currentPageIndex === 0;
            lastBtn.disabled = currentPageIndex === bookPages.length - 1;
        }

        // Navigation helpers with continuous looping
        function goToPage(index) {
            if (index < 0) {
                currentPageIndex = bookPages.length - 1;
            } else if (index >= bookPages.length) {
                currentPageIndex = 0;
            } else {
                currentPageIndex = index;
            }
            updateBookState();
        }

        function nextPage() {
            if (currentPageIndex < bookPages.length - 1) {
                currentPageIndex++;
            } else {
                currentPageIndex = 0; // Infinite loop back to cover
            }
            updateBookState();
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
            } else {
                currentPageIndex = bookPages.length - 1; // Loop to end
            }
            updateBookState();
        }

        // Auto-Play Loop Controls
        function toggleAutoPlay() {
            if (isPlaying) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        }

        function startAutoPlay() {
            isPlaying = true;
            playIcon.className = "fa-solid fa-pause";
            playText.textContent = "Pause Loop";
            playBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500', 'shadow-indigo-600/30');
            playBtn.classList.add('bg-amber-600', 'hover:bg-amber-500', 'shadow-amber-600/30');

            playInterval = setInterval(() => {
                nextPage();
            }, autoPlaySpeed);
        }

        function stopAutoPlay() {
            isPlaying = false;
            playIcon.className = "fa-solid fa-play";
            playText.textContent = "Auto Loop";
            playBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500', 'shadow-amber-600/30');
            playBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-500', 'shadow-indigo-600/30');

            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
        }

        // Event Listeners
        nextBtn.addEventListener('click', () => { nextPage(); stopAutoPlay(); });
        prevBtn.addEventListener('click', () => { prevPage(); stopAutoPlay(); });
        nextFloating.addEventListener('click', () => { nextPage(); stopAutoPlay(); });
        prevFloating.addEventListener('click', () => { prevPage(); stopAutoPlay(); });
        firstBtn.addEventListener('click', () => { goToPage(0); stopAutoPlay(); });
        lastBtn.addEventListener('click', () => { goToPage(bookPages.length - 1); stopAutoPlay(); });
        playBtn.addEventListener('click', toggleAutoPlay);

        pageScrubber.addEventListener('input', (e) => {
            goToPage(parseInt(e.target.value));
            stopAutoPlay();
        });

        speedRange.addEventListener('input', (e) => {
            autoPlaySpeed = parseInt(e.target.value);
            speedLabel.textContent = (autoPlaySpeed / 1000).toFixed(1) + 's';
            if (isPlaying) {
                clearInterval(playInterval);
                playInterval = setInterval(nextPage, autoPlaySpeed);
            }
        });

        // Keyboard & Touch events
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                nextPage();
                stopAutoPlay();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevPage();
                stopAutoPlay();
            } else if (e.key === ' ') {
                e.preventDefault();
                toggleAutoPlay();
            }
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.error(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        let touchStartX = 0;
        let touchEndX = 0;
        const bookElement = document.getElementById('book-element');
        
        bookElement.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        bookElement.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) {
                nextPage();
                stopAutoPlay();
            }
            if (touchEndX > touchStartX + 50) {
                prevPage();
                stopAutoPlay();
            }
        }, {passive: true});

        window.onload = function() {
            initFlipbook();
        };
    </script>

</body>
</html>
